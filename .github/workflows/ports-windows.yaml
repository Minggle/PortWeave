name: PortWeave - Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

# One run owns this platform's branch artifacts across refs.
concurrency:
  group: portweave-ports-windows
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-artifacts:
    if: github.repository == 'Minggle/PortWeave'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Free space for this platform's next artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const cleanup = require('./.github/scripts/ports-artifacts.js');
            await cleanup({github, context, core, platform: 'windows', phase: 'prepare'});

  windows:
    needs: prepare-artifacts
    permissions:
      contents: read
      actions: write
    timeout-minutes: 90
    if: github.repository == 'Minggle/PortWeave'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            core/go.sum
            plugins/setup/setup_hooks/lib/src/go_builder.dart
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ports-windows
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Enable git long paths
        run: git config --global core.longpaths true
      - name: Dependencies and analysis
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart format --output=none --set-exit-if-changed lib test tool plugins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze --no-fatal-infos
          exit $LASTEXITCODE
      - name: Feature and regression tests
        shell: pwsh
        run: |
          dart run tool/test.dart test/common/aggregate_port_test.dart test/views/aggregate_proxy_test.dart test/pages/home_test.dart test/providers/setup_state_test.dart test/common/priority_policy_test.dart test/providers/priority_policy_action_test.dart test/views/priority_policy_test.dart test/tool/packaging_config_test.dart test/tool/package_test.dart test/common/app_update_test.dart test/common/tray_test.dart test/common/tray_menu_test.dart test/common/tray_lifecycle_test.dart test/plugins/rust_api/tray_test.dart test/common/link_test.dart test/common/port_routing_test.dart test/providers/port_routing_action_test.dart test/views/port_routing_test.dart test/providers/config_test.dart test/providers/backup_action_test.dart test/common/http_test.dart test/common/system_dns_test.dart test/manager/proxy_manager_test.dart test/manager/tray_manager_test.dart test/manager/window_manager_test.dart test/core/desktop test/core/service_test.dart test/l10n test/database/migration_v1_to_v2_test.dart test/common/backup_task_test.dart test/providers/script_outbounds_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CGO_ENABLED = '0'
          go test -C core . -run '^Test(PortRouting|PriorityPolicy)Wire$' -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -C core . ./cmd/...
          exit $LASTEXITCODE
      - name: Build and package
        shell: pwsh
        run: |
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -split ':', 2)[1].Trim().Split('+')[0]
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a numeric release version' }
          flutter build windows --release --build-name=$version --dart-define=APP_ENV=pre
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File tool/package_windows.ps1 -Version $version -Arch amd64
          exit $LASTEXITCODE
      - name: Check size and clear superseded artifacts before upload
        uses: actions/github-script@v7
        with:
          script: |
            const check = require('./.github/scripts/ports-artifacts.js');
            await check({github, context, core, platform: 'windows', arch: 'amd64', phase: 'upload', paths: ['dist']});
      - uses: actions/upload-artifact@v4
        with:
          name: subscription-ports-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  cleanup-artifacts:
    if: always() && github.repository == 'Minggle/PortWeave'
    needs: [prepare-artifacts, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep only the latest run's platform artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const cleanup = require('./.github/scripts/ports-artifacts.js');
            await cleanup({github, context, core, platform: 'windows', phase: 'finish'});
