name: PortWeave - Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

# One run owns this platform's artifacts through release publication, across all refs.
concurrency:
  group: portweave-ports-windows
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-artifacts:
    if: github.repository == 'Minggle/PortWeave'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Free space for this platform's next artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const cleanup = require('./.github/scripts/ports-artifacts.js');
            await cleanup({github, context, core, platform: 'windows', phase: 'prepare'});

  windows:
    needs: prepare-artifacts
    permissions:
      contents: read
      actions: write
    timeout-minutes: 90
    if: github.repository == 'Minggle/PortWeave'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            core/go.sum
            plugins/setup/setup_hooks/lib/src/go_builder.dart
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ports-windows
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Enable git long paths
        run: git config --global core.longpaths true
      - name: Dependencies and analysis
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart format --output=none --set-exit-if-changed lib test tool plugins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze --no-fatal-infos
          exit $LASTEXITCODE
      - name: Feature and regression tests
        shell: pwsh
        run: |
          dart run tool/test.dart test/providers/setup_state_test.dart test/common/priority_policy_test.dart test/providers/priority_policy_action_test.dart test/views/priority_policy_test.dart test/common/app_update_test.dart test/tool/package_test.dart test/tool/packaging_config_test.dart test/common/port_routing_test.dart test/providers/port_routing_action_test.dart test/views/port_routing_test.dart test/providers/config_test.dart test/providers/backup_action_test.dart test/common/http_test.dart test/core/desktop test/l10n
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CGO_ENABLED = '0'
          go test -C core . -run '^Test(PortRouting|PriorityPolicy)Wire$' -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -C core . ./cmd/...
          exit $LASTEXITCODE
      - name: Build
        shell: pwsh
        run: |
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -split ':', 2)[1].Trim().Split('+')[0]
          $appEnv = 'pre'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME.Substring(1)
            $version = $tag.Split('-')[0]
            if (-not $tag.Contains('-')) { $appEnv = 'stable' }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a numeric release version' }
          flutter build windows --release --build-name=$version --dart-define=APP_ENV=$appEnv
          exit $LASTEXITCODE
      - name: Package
        shell: pwsh
        run: |
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -split ':', 2)[1].Trim().Split('+')[0]
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.Substring(1).Replace('+', '.') }
          New-Item -ItemType Directory -Path dist | Out-Null
          $name = "FlClash-$version-windows-amd64.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii dist/SHA256SUMS
      - name: Check size and clear superseded artifacts before upload
        uses: actions/github-script@v7
        with:
          script: |
            const check = require('./.github/scripts/ports-artifacts.js');
            await check({github, context, core, platform: 'windows', arch: 'amd64', phase: 'upload', paths: ['dist']});
      - uses: actions/upload-artifact@v4
        with:
          name: subscription-ports-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  release:
    if: github.repository == 'Minggle/PortWeave' && github.ref_type == 'tag'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: subscription-ports-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  cleanup-artifacts:
    if: always() && github.repository == 'Minggle/PortWeave'
    needs: [prepare-artifacts, windows, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep only the latest run's platform artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const cleanup = require('./.github/scripts/ports-artifacts.js');
            await cleanup({github, context, core, platform: 'windows', phase: 'finish'});
